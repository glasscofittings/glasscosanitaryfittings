[package]
name = "glassco-sanitary-fitting"
version = "0.1.0"
description = "Glassco Sanitary Fitting — Desktop Shell"
authors = ["Glassco Sanitary Fitting"]
edition = "2021"

[lib]
name = "glassco_sanitary_fitting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "0.4"
